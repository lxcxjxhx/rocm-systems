System Speed-of-Light:
  Theoretical LDS Bandwidth:
    rst: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS divided by total duration. Does not take into account the execution mask of the wavefront when the instruction was executed.
    unit: GB/s
  GL0 Cache Bandwidth:
    rst: The number of bytes requested from the GL0 vector cache (TCP Cache), divided by total duration. Each TCP_REQ cache-line request counts as 128 bytes, so this is an upper bound.
    unit: GB/s
  Memory Read Bandwidth:
    rst: The number of bytes the L2 cache (GL2C) reads over the EA for requests destined for VRAM, divided by total duration. The counter counts 32-byte granules. Infinity Cache hits are included, so this can exceed the VRAM bandwidth peak.
    unit: GB/s
  Memory Write Bandwidth:
    rst: The number of bytes the L2 cache (GL2C) writes over the EA for requests destined for VRAM, divided by total duration. The counter counts 32-byte granules. Infinity Cache hits are included.
    unit: GB/s
  WGP Utilization:
    rst: Percentage of WGP clock cycles at least one wavefront is active.
    unit: Percent
  VALU FLOPs:
    rst: VALU issues per second, excluding WMMA, at one FLOP per lane. gfx120x compute is wave32 by default, so that is 32 per instruction. SQ_INSTS_VALU counts every VALU issue, including integer, move, and convert, and an FMA counts as one issue while the FP32 roof counts it as two FLOPs. A pure FMA kernel therefore reads low. A tiled FP32 GEMM also issues address arithmetic, so this metric can read about twice the true FLOP count. SQ_WMMA_VALU_INSTS is per vec32, the same unit as SQ_INSTS_VALU for gfx120x compute.
    unit: GFLOP/s
  WMMA FLOPs (F16->F32 16x16x16):
    rst: Achieved FP16 WMMA throughput.
    unit: GFLOP/s
  VALU Issue Rate:
    rst: Billions of VALU instruction issues per second. The counter includes floating-point and integer instructions and does not count FLOPs or active lanes.
    unit: GInstructions/s
  FP64 VALU Issue Rate:
    rst: Billions of double-precision VALU instruction issues per second. This is an instruction rate, without accounting for FLOPs per instruction or active lanes.
    unit: GInstructions/s
  IPC:
    rst: Instructions executed per cycle, measuring overall instruction throughput efficiency. Higher IPC indicates better utilization of the shader pipeline. Low IPC may indicate stalls due to memory latency, register dependencies, or insufficient wavefront occupancy to hide latencies.
    unit: Instructions per Cycle
  LDS Utilization:
    rst: Percentage of the LDS cycle budget across all CUs spent servicing indexed (non-direct, non-interpolation) accesses, measured over GPU-active cycles. Because two CUs share a workgroup processor's LDS, a saturated LDS reads well below 100% on this architecture.
    unit: Percent
  LDS Bank Conflicts:
    rst: Cycles LDS stalled on conflicting bank addresses, averaged per dispatch.
    unit: Conflicts
  GL2 Cache Hit Rate:
    rst: Percentage of L2 lookups that hit.
    unit: Percent
  sL1D Load Bandwidth:
    rst: The number of bytes loaded by scalar memory instructions, divided by total duration. The number of bytes is the number of dwords each instruction loads multiplied by four; bounds-check reductions are ignored.
    unit: GB/s
  sL1D Hit Rate:
    rst: Percentage of scalar data cache accesses that hit. High hit rates indicate efficient reuse of constant and uniform data. Low rates may suggest excessive unique constant data or poor temporal locality.
    unit: Percent
  L1I Hit Rate:
    rst: Percentage of instruction cache accesses that hit. High hit rates are essential for sustained instruction throughput. Low rates may indicate large kernels or divergent branches causing instruction cache thrashing.
    unit: Percent
  Wavefront Occupancy:
    rst: Average number of wavefronts resident on the GPU during kernel execution. Higher occupancy provides more opportunities to hide memory latency through wavefront switching. However, maximum occupancy is not always optimal. Excessive register or LDS usage per wavefront may limit occupancy.
    unit: Wavefronts
  GL0 Cache Hit Rate (TCP Cache):
    rst: Percentage of GL0 cache requests serviced from cache without accessing GL1. Higher hit rates indicate better data locality and lower memory access latency. Low hit rates may indicate working sets exceeding GL0 capacity or poor access patterns.
    unit: Percent
Memory chart - Instruction Cache:
  ICache Requests:
    rst: Instruction cache requests from the SQ, normalized by the chosen unit.
    unit: Requests per Normalization Unit
  ICache Hit Rate:
    rst: Percentage of instruction cache accesses that hit. High hit rates are essential for sustained instruction throughput. Low rates may indicate large kernels or divergent branches causing instruction cache thrashing.
    unit: Percent
Memory chart - Scalar Data Cache:
  DCache Requests:
    rst: Scalar data cache requests after bank serialization, normalized by the chosen unit.
    unit: Requests per Normalization Unit
  DCache Hit Rate:
    rst: Percentage of scalar data cache accesses that hit. High hit rates indicate efficient reuse of constant and uniform data. Low rates may suggest excessive unique constant data or poor temporal locality.
    unit: Percent
  DCache Load Bandwidth:
    rst: The number of bytes loaded by scalar memory instructions, divided by total duration. The number of bytes is the number of dwords each instruction loads multiplied by four; bounds-check reductions are ignored.
    unit: GB/s
Memory chart - GL0 Cache (Vector L0):
  GL0 Hit Rate:
    rst: Percentage of GL0 cache requests serviced from cache without accessing GL1. Higher hit rates indicate better data locality and lower memory access latency. Low hit rates may indicate working sets exceeding GL0 capacity or poor access patterns.
    unit: Percent
Memory chart - LDS (Local Data Share):
  LDS Req:
    rst: Number of Local Data Share instructions executed. LDS provides fast shared memory within a workgroup. High counts indicate active use of shared memory for inter-work-item communication.
    unit: Count per Normalization Unit
  LDS Utilization:
    rst: Percentage of the LDS cycle budget across all CUs spent servicing indexed (non-direct, non-interpolation) accesses, measured over GPU-active cycles. Because two CUs share a workgroup processor's LDS, a saturated LDS reads well below 100% on this architecture.
    unit: Percent
  LDS Bank Conflict Rate:
    rst: Percentage of LDS accesses that experienced bank conflicts. Conflicts occur when multiple work-items in a wavefront access different addresses in the same LDS bank. High conflict rates reduce effective LDS bandwidth. Restructuring data layouts can help.
    unit: Percent
  LDS Bandwidth:
    rst: The number of bytes loaded from, stored to, or atomically updated in the LDS, divided by total duration. The number of bytes is the number of dwords accessed by load, store, and atomic instructions multiplied by four.
    unit: GB/s
Memory chart - GL2 Cache (L2):
  GL2 Hit Rate:
    rst: Percentage of L2 lookups that hit.
    unit: Percent
Memory chart - L2 to Memory:
  Memory Read Requests:
    rst: L2 read requests over EA destined for memory. Infinity Cache can serve these requests before they reach VRAM.
    unit: Count per Normalization Unit
  Memory Write Requests:
    rst: L2 write requests over EA destined for memory. Infinity Cache can absorb these requests before they reach VRAM.
    unit: Count per Normalization Unit
  Memory Read Bandwidth:
    rst: The number of bytes the L2 cache (GL2C) reads over the EA for requests destined for VRAM, divided by total duration. The counter counts 32-byte granules. Infinity Cache hits are included, so this can exceed the VRAM bandwidth peak.
    unit: GB/s
  Memory Write Bandwidth:
    rst: The number of bytes the L2 cache (GL2C) writes over the EA for requests destined for VRAM, divided by total duration. The counter counts 32-byte granules. Infinity Cache hits are included.
    unit: GB/s
Memory chart - Workgroup Processors (WGPs):
  Wavefront Occupancy:
    rst: Resident :ref:`wavefronts <desc-wavefront>` per WGP, averaged over GPU-active cycles, as a percent of the maximum wavefronts per WGP.
    unit: Percent
  VGPR:
    rst: Architectural vector general-purpose registers allocated for the kernel, from dispatch metadata. Allocation granularity can increase the reported value above the compiler's request.
    unit: Registers
  SGPR:
    rst: The number of scalar general-purpose registers allocated per wavefront. On this architecture every wavefront gets 128.
    unit: Registers
  LDS Allocation:
    rst: 'The number of bytes of LDS memory (or, shared memory) allocated per :ref:`workgroup <desc-workgroup>`. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
    unit: Bytes per Workgroup
  Scratch Allocation:
    rst: 'The amount of scratch memory requested per :ref:`wavefront <desc-wavefront>`, in KB: the scratch bytes requested per :ref:`work-item <desc-work-item>` multiplied by the wavefront size. Scratch memory is used for stack memory on the accelerator, as well as for register spills and restores.'
    unit: KB per Wavefront
  Workgroups:
    rst: The number of :ref:`workgroups <desc-workgroup>` in the launch divided by the number of WGPs.
    unit: Workgroups per WGP
Roofline Performance Rates:
  VALU FLOPs:
    rst: VALU issues per second, excluding WMMA, at one FLOP per lane. gfx120x compute is wave32 by default, so that is 32 per instruction. SQ_INSTS_VALU counts every VALU issue, including integer, move, and convert, and an FMA counts as one issue while the FP32 roof counts it as two FLOPs. A pure FMA kernel therefore reads low. A tiled FP32 GEMM also issues address arithmetic, so this metric can read about twice the true FLOP count. SQ_WMMA_VALU_INSTS is per vec32, the same unit as SQ_INSTS_VALU for gfx120x compute.
    unit: GFLOP/s
  WMMA FLOPs (FP16):
    rst: Achieved FP16 WMMA throughput.
    unit: GFLOP/s
  VALU FLOPs (F64):
    rst: 64-bit floating-point operations per second on the VALU.
    unit: GFLOP/s
  GL0 Cache BW (TCP Cache):
    rst: The number of bytes requested from the GL0 vector cache (TCP Cache), divided by total duration. Each TCP_REQ cache-line request counts as 128 bytes, so this is an upper bound.
    unit: GB/s
  LDS BW:
    rst: Indicates the maximum amount of bytes that could have been loaded from, stored to, or atomically updated in the LDS divided by total duration. Does not take into account the execution mask of the wavefront when the instruction was executed.
    unit: GB/s
  L2 to Memory BW:
    rst: The number of bytes the L2 cache (GL2C) reads from and writes to memory over the EA, divided by total duration. The counters count 32-byte granules. They include requests the Infinity Cache serves and cannot separate them, so this can be higher than true VRAM traffic and can exceed the measured VRAM peak.
    unit: GB/s
Roofline Plot Points:
  AI L0:
    rst: Arithmetic intensity relative to GL0 (TCP) requests, at 128 bytes per TCP_REQ as an upper bound on GL0 bytes. The FLOP numerator is the VALU FLOPs excluding the WMMA instructions already counted in SQ_INSTS_VALU, plus the WMMA FLOPs at 8192 per instruction.
    unit: FLOPs/Byte
  AI LDS:
    rst: Arithmetic intensity relative to Local Data Share traffic. The FLOP numerator is the VALU FLOPs excluding the WMMA instructions already counted in SQ_INSTS_VALU, plus the WMMA FLOPs at 8192 per instruction.
    unit: FLOPs/Byte
  AI VRAM:
    rst: Arithmetic intensity relative to GL2C/EA requests destined for VRAM. The plot marks the point at the VRAM level. The requests include those the Infinity Cache serves, and the counters cannot separate them, so this intensity can be lower than the true VRAM intensity. The FLOP numerator is the VALU FLOPs excluding the WMMA instructions already counted in SQ_INSTS_VALU, plus the WMMA FLOPs at 8192 per instruction.
    unit: FLOPs/Byte
  Performance (GFLOPs):
    rst: Achieved VALU plus WMMA throughput of floating-point operations per second. The FLOP count is the VALU FLOPs excluding the WMMA instructions already counted in SQ_INSTS_VALU, plus the WMMA FLOPs at 8192 per instruction.
    unit: GFLOP/s
Wave Dispatch Statistics:
  Compute Wave Dispatches:
    rst: Total wavefronts dispatched (SQ_WAVES_sum).
    unit: Count per Normalization Unit
  Wave Dispatch Rate:
    rst: Average wavefronts launched per busy cycle.
    unit: Wavefronts per Cycle
WGP Utilization:
  WGP Utilization:
    rst: Percentage of WGP clock cycles at least one wavefront is active.
    unit: Percent
WGP Wavefront Launch Stats:
  Grid Size:
    rst: Number of work-items in the dispatch grid, from dispatch metadata.
    unit: Work-items
  Workgroup Size:
    rst: Number of work-items per workgroup, from dispatch metadata.
    unit: Work-items
  VGPRs:
    rst: Architectural vector general-purpose registers allocated for the kernel, from dispatch metadata. Allocation granularity can increase the reported value above the compiler's request.
    unit: Registers
  SGPRs:
    rst: The number of scalar general-purpose registers allocated per wavefront. On this architecture every wavefront gets 128.
    unit: Registers
  LDS Allocation:
    rst: 'The number of bytes of LDS memory (or, shared memory) allocated per workgroup. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
    unit: Bytes per Workgroup
  Scratch Allocation:
    rst: Bytes of scratch memory allocated per work-item, from dispatch metadata.
    unit: Bytes per Work-item
WGP Wavefront Dispatch:
  Dispatched Waves:
    rst: Total wavefronts dispatched.
    unit: Wavefronts
  Dispatched Threads:
    rst: Total work-items dispatched.
    unit: Threads
WGP Wavefront Life:
  Wave Life:
    rst: Average number of cycles from wavefront creation to completion. Longer wavefront life indicates more execution time per wavefront, which may be due to complex kernels, memory latency, or synchronization waits.
    unit: Cycles
WGP Wavefront Instruction Mix:
  Total Instructions:
    rst: Total number of instructions executed across all wavefronts. This provides an overall measure of computational work. Compare with specific instruction types to understand the workload characteristics.
    unit: Count per Normalization Unit
  Instructions - Internal:
    rst: Internal SQ instructions (SQ_INSTS_INTERNAL) per normalization unit. These represent bookkeeping or non-user-visible work issued by the SQ.
    unit: Count per Normalization Unit
  Instructions - VALU:
    rst: Number of Vector ALU instructions executed. VALU handles arithmetic and logic operations across all work-items in a wavefront. High VALU counts indicate compute-intensive kernels.
    unit: Count per Normalization Unit
  Instructions - SALU:
    rst: Number of Scalar ALU instructions executed. SALU handles operations with uniform values across the wavefront. Efficient kernels often have a balance of VALU and SALU operations.
    unit: Count per Normalization Unit
  Instructions - SMEM:
    rst: Number of scalar memory instructions executed. SMEM loads constant and uniform data through the scalar cache. High counts may indicate heavy use of constant buffers or kernel arguments.
    unit: Count per Normalization Unit
  Instructions - Transcendental:
    rst: Transcendental VALU instructions (SQ_INSTS_VALU_TRANS) per normalization unit. These cover hardware approximations such as sin, cos, and log on the vector ALU.
    unit: Count per Normalization Unit
  Instructions - VMEM:
    rst: Number of vector memory instructions executed, including global, buffer, and texture operations. High VMEM counts relative to VALU may indicate memory-bound workloads.
    unit: Count per Normalization Unit
  Instructions - LDS:
    rst: Number of Local Data Share instructions executed. LDS provides fast shared memory within a workgroup. High counts indicate active use of shared memory for inter-work-item communication.
    unit: Count per Normalization Unit
WGP VMEM Instruction Mix:
  Instructions - VMEM Flat:
    rst: Issued flat-addressed vector memory instructions, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Instructions - TEX Load:
    rst: Issued buffer loads, image loads, samples, and atomics with a return value, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Instructions - TEX Store:
    rst: Issued buffer stores, image stores, and atomics without a return value, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Instructions - Flat Load:
    rst: Issued flat-addressed load instructions, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Instructions - Flat Store:
    rst: Issued flat-addressed store instructions, normalized by the chosen unit.
    unit: Count per Normalization Unit
WGP LDS Instruction Mix:
  LDS Direct Load Instructions:
    rst: Number of direct LDS load instructions. Direct loads fetch data from LDS without address indirection. These are typically faster than indexed LDS operations.
    unit: Count per Normalization Unit
  LDS Parameter Load Instructions:
    rst: Number of LDS parameter load instructions. These load shader input parameters that have been staged in LDS for efficient access by the wavefront.
    unit: Count per Normalization Unit
WGP VALU Instruction Mix:
  SQ_INSTS_VALU:
    rst: Raw vector arithmetic instruction count. This includes integer and floating-point instructions and is not a FLOP count.
    unit: Instructions
  SQ_INST_CYCLES_VALU:
    rst: Cycles needed to execute VALU operations, counting overlapping V_OP32_1 and V_OP32_T instructions separately.
    unit: Cycles
WGP WMMA Instruction FLOPs and IOPs Counting:
  SQ_WMMA_VALU_INSTS:
    rst: Number of WMMA instructions issued.
    unit: Instructions
  SQ_INST_CYCLES_VALU_WMMA:
    rst: Cycles of work sent for WMMA.
    unit: Cycles
WGP Instruction Cache:
  Icache Hit Rate:
    rst: Percentage of instruction cache accesses that hit. High hit rates are essential for sustained instruction throughput. Low rates may indicate large kernels or divergent branches causing instruction cache thrashing.
    unit: Percent
WGP Scalar Data Cache:
  Dcache Hit Rate:
    rst: Percentage of scalar data cache accesses that hit. High hit rates indicate efficient reuse of constant and uniform data. Low rates may suggest excessive unique constant data or poor temporal locality.
    unit: Percent
GL0 Request Statistics:
  Total Requests:
    rst: Total number of requests to the GL0 vector cache, including reads, writes, and atomics. This represents the overall memory traffic generated by vector memory instructions from the shader cores.
    unit: Requests per Normalization Unit
  Miss Requests:
    rst: Number of GL0 cache requests that missed and required fetching from GL1. High miss counts increase memory access latency. Consider improving data locality or access patterns to reduce misses.
    unit: Count per Normalization Unit
GL0 Cache Performance:
  Hit Rate:
    rst: Percentage of GL0 cache requests serviced from cache without accessing GL1. Higher hit rates indicate better data locality and lower memory access latency. Low hit rates may indicate working sets exceeding GL0 capacity or poor access patterns.
    unit: Percent
GL0 Stalls:
  TA Req Stall:
    rst: Cycles the Texture Addresser was stalled waiting for the GL0 cache to accept requests. High stall counts indicate GL0 cache backpressure limiting memory request throughput.
    unit: Cycles per Normalization Unit
GL1 Cache Request Statistics:
  Total Requests:
    rst: Total number of requests received by GL1 from all GL0 caches (TCP instances) within the shader engine. This represents aggregated memory traffic from multiple Workgroup Processors.
    unit: Requests per Normalization Unit
GL2 Cache Request Statistics:
  Total Requests:
    rst: L2 requests, normalized by the chosen unit.
    unit: Count per Normalization Unit
  Read Requests:
    rst: Number of read requests to the GL2 cache. High read counts indicate memory-intensive load operations. Compare with hit rate to assess GL2 cache effectiveness for reads.
    unit: Count per Normalization Unit
  Write Requests:
    rst: Number of write requests to the GL2 cache. Write traffic includes stores and cache writebacks from GL1. High write counts indicate write-intensive workloads.
    unit: Count per Normalization Unit
  Atomic Requests:
    rst: Number of atomic memory operations processed by the GL2 cache. Atomics provide thread-safe memory access but may serialize at contended addresses. High counts may impact performance.
    unit: Count per Normalization Unit
  EA Read Requests (Memory):
    rst: L2 read requests over EA destined for memory. Infinity Cache can serve these requests before they reach VRAM.
    unit: Count per Normalization Unit
  EA Write Requests (Memory):
    rst: L2 write requests over EA destined for memory. Infinity Cache can absorb these requests before they reach VRAM.
    unit: Count per Normalization Unit
GL2 Cache Performance:
  GL2 Cache Hit Rate:
    rst: Percentage of L2 lookups that hit.
    unit: Percent
  GL2 Cache Hits:
    rst: Number of GL2 cache requests that were serviced from cache. High hit counts relative to total requests indicate effective caching. Low hit counts suggest memory-bound workloads or poor data locality.
    unit: Count per Normalization Unit
  GL2 Cache Misses:
    rst: Number of GL2 cache requests that missed and required fetching through GCEA (Graphics Core Efficiency Arbiter). High miss counts indicate heavy memory traffic. Consider improving data locality or reducing working set size.
    unit: Count per Normalization Unit
GRBM Metrics:
  GPU Busy:
    rst: Percentage of time the GPU was actively processing work. This is the primary utilization metric showing overall GPU activity. Low GPU busy indicates underutilization, possibly due to insufficient workload or host-side bottlenecks.
    unit: Percent

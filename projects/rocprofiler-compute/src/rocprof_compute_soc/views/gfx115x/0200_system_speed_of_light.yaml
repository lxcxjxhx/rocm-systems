  - metric: wave.wait_for_any
    label: Wave Dependency Wait
    pct_of_peak: false
  - metric: wave.issue_wait
    pct_of_peak: false
  - metric: gl0.hit_rate
    label: GL0 Cache Hit Rate (TCP Cache)
    pct_of_peak: false
  - metric: gl0.bw
    label: GL0 Cache BW (TCP Cache)
  - metric: gl1.hit_rate
    label: GL1 Cache Hit Rate
    pct_of_peak: false
  - metric: gl1.gl2_rd_bw
